<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MacRemote Widget Test Harness</title>
<style>
  body { margin: 0; padding: 16px; background: #ececf0; font-family: -apple-system, sans-serif; }
  body.dark { background: #131316; }
  iframe { width: 100%; max-width: 760px; border: none; display: block; margin: 0 auto; height: 200px; }
</style>
</head>
<body>
<iframe id="widget" src="../MacRemoteWidget.html"></iframe>
<script>
"use strict";
/* Plays the MCP Apps HOST role for the widget under test (SEP-1865):
   answers ui/initialize, streams tool-input + tool-result fixtures, proxies
   tools/call (recording every call in window.__toolCalls), resizes on
   ui/notifications/size-changed. Select fixture + theme via query string:
   harness.html?fixture=table&theme=dark */

const params = new URLSearchParams(location.search);
const fixtureName = params.get("fixture") || "table";
const theme = params.get("theme") || "light";
if (theme === "dark") { document.body.classList.add("dark"); }

const REMINDERS = [
  { id: 23901, title: "Publish MacRemote article", list: "Editorial", dueDate: "2026-07-09T14:00:00", allDay: false, priority: "high", completed: false, flagged: false, urgent: true, subtaskCount: 0 },
  { id: 23902, title: "Record podcast segment", list: "Podcasts", dueDate: "2026-07-09T14:30:00", allDay: false, priority: "none", completed: false, flagged: false, urgent: false, subtaskCount: 0 },
  { id: 23903, title: "Reply to WWDC follow-ups", list: "Emails", dueDate: "2026-07-10T09:00:00", allDay: false, priority: "medium", completed: true, flagged: false, urgent: false, subtaskCount: 0 },
  { id: 23904, title: "Order studio cables", list: "Shopping", dueDate: null, allDay: false, priority: "none", completed: false, flagged: false, urgent: false, subtaskCount: 0 },
  { id: 23905, title: "Family dinner", list: "Family", dueDate: "2026-07-11T00:00:00", allDay: true, priority: "none", completed: false, flagged: true, urgent: false, subtaskCount: 5 }
];

const UI_META = {
  version: 1,
  toolTitle: "Upcoming",
  toolName: "remctl_upcoming",
  capability: "readOnly",
  category: "Reminders",
  accent: "#8b5cf6",
  table: {
    columns: [
      { key: "when", title: "When", derive: "datetime", sourceKey: "dueDate", allDayKey: "allDay" },
      { key: "title", title: "Task", primary: true },
      { key: "list", title: "List" }
    ],
    hiddenColumns: ["id", "completed"]
  },
  actions: [{
    id: "complete", title: "Mark Done", kind: "checkOff",
    toolName: "remctl_run", toolCapability: "destructive",
    arguments: { args: ["done", "{id}", "--json"] },
    requiredRowFields: ["id"], completedWhenField: "completed"
  }, {
    id: "reschedule", title: "Reschedule", kind: "rowButton",
    toolName: "remctl_run", toolCapability: "destructive",
    arguments: { args: ["edit", "{id}", "-d", "{input.due}", "--json"] },
    requiredRowFields: ["id"],
    inputs: [{ name: "due", title: "New due", placeholder: "tomorrow 9:30" }]
  }, {
    id: "delete", title: "Delete", kind: "rowButton",
    toolName: "remctl_run", toolCapability: "destructive",
    arguments: { args: ["delete", "{id}", "--force", "--json"] },
    requiredRowFields: ["id"], style: "destructive"
  }]
};

const EPISODES = [
  { uuid: "f0fa0c5d-ce56-4079-9054-dcbe414aaee5", url: "https://www.podtrac.com/pts/redirect.mp3/traffic.libsyn.com/secure/upgradeplus626.mp3",
    published: "2026-06-29T21:00:00Z", duration: 6213, fileType: "audio/mp3", title: "Unprecedented Weirdness", size: "126583816",
    playingStatus: 2, playedUpTo: 4137, starred: false, podcastUuid: "484f5720-ec94-0139-d4c2-0acc26574db2",
    podcastTitle: "Upgrade+ — Private to Federico Viticci", episodeNumber: 626, author: "Relay" },
  { uuid: "01a894b1-c26c-43e2-9f5d-37e738047670", url: "https://www.podtrac.com/pts/redirect.mp3/traffic.libsyn.com/Moretex_177.mp3",
    published: "2026-03-23T16:15:00Z", duration: 5042, fileType: "audio/mp3", title: "How Major Life Changes Reshape Creative Workflows, With Quinn Nelson", size: "81196535",
    playingStatus: 2, playedUpTo: 2285, starred: false, podcastUuid: "aa7f4440-ec94-0139-d4c2-0acc26574db2",
    podcastTitle: "Moretex — Private to Federico Viticci", episodeNumber: 177, author: "Relay" },
  { uuid: "92f82cef-d654-4e55-9723-09b0dfd632fd", url: "https://www.patreon.com/api/rss/u/example/e/147791572.mp3",
    published: "2026-01-09T08:00:00Z", duration: 3696, fileType: "audio/mpeg", title: "The Most Anticipated Games of 2026", size: "59136000",
    playingStatus: 2, playedUpTo: 300, starred: true, podcastUuid: "0e2b1031-e081-6ef1-8f7b-0266557711f5",
    podcastTitle: "Remaster", episodeNumber: 104, author: "Relay" }
];

const POCKET_UI_META = {
  version: 1,
  toolTitle: "PocketCTL In Progress",
  toolName: "pocketctl_in_progress",
  capability: "readOnly",
  category: "Podcasts",
  accent: "#f43e37",
  table: {
    columns: [
      { key: "artwork", title: "", derive: "artwork", sourceKey: "podcastUuid", altKey: "podcastTitle",
        urlTemplate: "https://static.pocketcasts.com/discover/images/webp/200/{value}.webp" },
      { key: "title", title: "Episode", primary: true },
      { key: "podcastTitle", title: "Podcast" },
      { key: "duration", title: "Duration", derive: "duration", sourceKey: "duration" },
      { key: "progress", title: "Played", derive: "progress", sourceKey: "playedUpTo", totalKey: "duration" },
      { key: "url", title: "Link", derive: "link", sourceKey: "url" }
    ],
    hiddenColumns: ["uuid", "published", "fileType", "size", "podcastUuid", "playingStatus"]
  },
  actions: [{
    id: "play_next", title: "Play Next", kind: "rowButton",
    toolName: "pocketctl_run", toolCapability: "destructive",
    arguments: { args: ["play-next", "{uuid}"] }, requiredRowFields: ["uuid"]
  }, {
    id: "play_last", title: "Play Last", kind: "rowButton",
    toolName: "pocketctl_run", toolCapability: "destructive",
    arguments: { args: ["play-last", "{uuid}"] }, requiredRowFields: ["uuid"]
  }, {
    id: "star", title: "Star", kind: "rowButton",
    toolName: "pocketctl_run", toolCapability: "destructive",
    arguments: { args: ["star", "{uuid}"] }, requiredRowFields: ["uuid"]
  }]
};

function envelope(overrides) {
  return Object.assign({
    toolID: "remctl.today", toolName: "remctl_today", exitCode: 0, succeeded: true,
    stdout: "", stderr: "", durationSeconds: 0.42, timedOut: false,
    truncatedStdout: false, truncatedStderr: false
  }, overrides || {});
}

const FIXTURES = {
  table: { structuredContent: envelope({ stdout: JSON.stringify({ items: REMINDERS }) }), _meta: {"net.viticci.macremote/ui": UI_META} },
  podcasts: { structuredContent: envelope({ toolID: "preset.pocketctl.in_progress", toolName: "pocketctl_in_progress", stdout: JSON.stringify(EPISODES) }), _meta: {"net.viticci.macremote/ui": POCKET_UI_META} },
  actionfail: { structuredContent: envelope({ stdout: JSON.stringify({ items: REMINDERS }) }), _meta: {"net.viticci.macremote/ui": UI_META} },
  tree: { structuredContent: envelope({ stdout: JSON.stringify({ database: { path: "/tmp/db", reminders: 412, lists: 9 }, ok: true }) }), _meta: {"net.viticci.macremote/ui": {version: 1, toolTitle: "Stats", toolName: "remctl_stats", capability: "readOnly"}} },
  terminal: { structuredContent: envelope({ stdout: "Build settings:\n  [1mSDKROOT[0m = [32mMacOSX26.5.sdk[0m\n  [33mwarning:[0m 2 targets skipped\n[34mBuild complete![0m (14.2s)\n[38;2;200;40;40mtruecolor-test red[0m [38;5;46m256-green[0m still-[1mbold[0m" }), _meta: {"net.viticci.macremote/ui": {version: 1, toolTitle: "Swift Build", toolName: "swift_cli", capability: "destructive"}} },
  error: { structuredContent: envelope({ succeeded: false, exitCode: 1, stdout: "", stderr: "error: Reminders store not readable from this process context.\nGrant Full Disk Access and retry." }), isError: true, _meta: {"net.viticci.macremote/ui": {version: 1, toolTitle: "Today", toolName: "remctl_today", capability: "readOnly"}} },
  empty: { structuredContent: envelope({ stdout: "" }), _meta: {"net.viticci.macremote/ui": {version: 1, toolTitle: "Sync", toolName: "sync_tool", capability: "write"}} },
  truncated: { structuredContent: envelope({ stdout: "partial output…", truncatedStdout: true }), _meta: {"net.viticci.macremote/ui": {version: 1, toolTitle: "Log Dump", toolName: "log_dump", capability: "readOnly"}} },
  habits: { structuredContent: envelope({ toolName: "habitctl_today", stdout: JSON.stringify([
    { id: "-OwFK1", name: "Listen to one new song", status: "inprogress", type: "good" },
    { id: "-OwFK2", name: "Morning walk", status: "completed", type: "good" },
    { id: "-OwFK3", name: "Read 20 pages", status: "inprogress", type: "good" }
  ]) }), _meta: {"net.viticci.macremote/ui": {version: 1, toolTitle: "HabitCTL Today", toolName: "habitctl_today", capability: "readOnly", actions: [{
    id: "check", title: "Mark Complete", kind: "checkOff",
    toolName: "habitctl_run", toolCapability: "destructive",
    arguments: { args: ["check", "{id}"] },
    requiredRowFields: ["id"], completedWhenField: "status", completedWhenEquals: "completed"
  }]}} }
};

const iframe = document.getElementById("widget");
window.__toolCalls = [];
window.__sizeEvents = [];
window.__initialized = false;

window.addEventListener("message", (event) => {
  if (event.source !== iframe.contentWindow) { return; }
  const msg = event.data;
  if (!msg || msg.jsonrpc !== "2.0") { return; }
  const send = (m) => iframe.contentWindow.postMessage(m, "*");

  if (msg.method === "ui/initialize") {
    send({ jsonrpc: "2.0", id: msg.id, result: {
      protocolVersion: "2026-01-26",
      hostInfo: { name: "HarnessHost", version: "1.0" },
      hostCapabilities: { serverTools: {} },
      hostContext: { theme: theme, platform: "web" }
    }});
    return;
  }
  if (msg.method === "ui/notifications/initialized") {
    window.__initialized = true;
    send({ jsonrpc: "2.0", method: "ui/notifications/tool-input", params: { arguments: { days: 7 } } });
    send({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: FIXTURES[fixtureName] });
    return;
  }
  if (msg.method === "ui/notifications/size-changed") {
    window.__sizeEvents.push(msg.params);
    if (msg.params && msg.params.height) { iframe.style.height = Math.min(msg.params.height, 640) + "px"; }
    return;
  }
  if (msg.method === "tools/call") {
    window.__toolCalls.push(msg.params);
    // fixture=actionfail: every proxied call fails with a CLI-style stderr,
    // exercising the widget's visible Failed state + tooltip.
    const fail = fixtureName === "actionfail";
    setTimeout(() => {
      send({ jsonrpc: "2.0", id: msg.id, result: {
        structuredContent: envelope({
          toolName: msg.params.name,
          exitCode: fail ? 2 : 0, succeeded: !fail,
          stdout: fail ? "" : "{\"ok\": true}",
          stderr: fail ? "usage: remctl [-h] ...\nremctl: error: unrecognized arguments: --json" : ""
        }),
        content: [{ type: "text", text: fail ? "{}" : "{\"ok\": true}" }],
        isError: fail
      }});
    }, 250);
    return;
  }
});
</script>
</body>
</html>
