<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #ececf0; color: #1d1d1f; font-family: -apple-system, sans-serif; }
  body.dark { background: #131316; color: #f5f5f7; }
  .controls {
    display: flex; flex-wrap: wrap; align-items: end; gap: 10px 14px;
    max-width: 920px; margin: 0 auto 16px; padding: 12px;
    border: 1px solid color-mix(in srgb, currentColor 14%, transparent); border-radius: 10px;

    border-radius: 7px; background: Canvas; color: CanvasText; font: inherit; font-size: 12px;
  }

     simulating, so ?theme=dark used to draw light chrome under light text. */
  body.dark .controls { background: #1e1e22; }
  body.dark .controls select { background: #2a2a30; color: #f5f5f7; }
  #assertions { margin-left: auto; align-self: center; font: 600 11px ui-monospace, monospace; }
  #assertions[data-state="pass"] { color: light-dark(#16712e, #4fd675); }
  #assertions[data-state="fail"] { color: light-dark(#c50f1f, #ff6961); }
  .stage { width: 100%; overflow: visible; }
  iframe { border: none; display: block; margin: 0 auto; height: 200px; background: transparent; transform-origin: top center; }

</head>

   tools/call and ui/open-link, and exercises host-context changes, malformed
   messages, teardown, capability gates, and finite positive width/height size
   notifications. It records the relevant calls, links, sizes, and outcomes.
   Select behavior via query:
   harness.html?fixture=table&theme=dark&width=390&zoom=200&serverTools=1&openLinks=1 */

const params = new URLSearchParams(location.search);
const fixtureName = params.get("fixture") || "table";
const theme = params.get("theme") || "light";
const frameWidth = Number(params.get("width")) === 390 ? 390 : 760;
const zoomPercent = Number(params.get("zoom")) === 200 ? 200 : 100;
const supportsServerTools = params.get("serverTools") !== "0";
const supportsOpenLinks = params.get("openLinks") !== "0";
const exercise = params.get("exercise") || "";
// host=mismatch declares `theme` but sends the other theme's colors;
// host=themeless sends `theme`'s colors without declaring a theme;
// host=lowsecondary sends `theme`'s colors with a secondary text color under
// 4.5:1 on the host background; host=unmeasurable sends a secondary text
// color too transparent to measure. Each of the last two must be set aside.
const hostVariant = params.get("host") || "";
if (theme === "dark") { document.body.classList.add("dark"); }

const controls = {
  fixture: document.getElementById("fixture-control"),
  theme: document.getElementById("theme-control"),
  width: document.getElementById("width-control"),
  zoom: document.getElementById("zoom-control")
};
controls.fixture.value = fixtureName;
controls.theme.value = theme;
controls.width.value = String(frameWidth);
controls.zoom.value = String(zoomPercent);
for (const [key, control] of Object.entries(controls)) {
  control.addEventListener("change", () => {
    const next = new URLSearchParams(location.search);
    next.set(key, control.value);
    location.search = next.toString();
  });
}

  });
}

function withFallbackContent(result) {
  if (Array.isArray(result.content)) return result;
  const hasStructuredContent = Object.prototype.hasOwnProperty.call(result, "structuredContent");
  const serialized = hasStructuredContent ? JSON.stringify(result.structuredContent) : "";
  return Object.assign({}, result, {
    content: [{ type: "text", text: typeof serialized === "string" ? serialized : "" }]
  });
}

// WCAG luminance of a computed color, through a canvas so every syntax the
// browser can compute (rgb, color(srgb …), light-dark results) resolves.
// With `over`, the color is painted on that opaque backdrop first, so a
// translucent text color is measured as it shows, not as its raw channels.
const harnessColorProbe = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
function harnessLuminance(color, over) {
  harnessColorProbe.clearRect(0, 0, 1, 1);
  if (over) {
    harnessColorProbe.fillStyle = over;
    harnessColorProbe.fillRect(0, 0, 1, 1);
  }
  harnessColorProbe.fillStyle = "#000";
  harnessColorProbe.fillStyle = color;
  harnessColorProbe.fillRect(0, 0, 1, 1);
  const [r, g, b, a] = harnessColorProbe.getImageData(0, 0, 1, 1).data;
  if (a === 0) return null;
  const linear = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  return 0.2126 * linear(r) + 0.7152 * linear(g) + 0.0722 * linear(b);
}

// The backdrop under the widget's text: its root background when it paints
// one, otherwise the opaque canvas the browser paints in the root's scheme
// (the frame's own scheme differs from the harness page's in half the runs).
function widgetTextContrast(doc) {
  const rootStyle = getComputedStyle(doc.documentElement);
  const backdropColor = harnessLuminance(rootStyle.backgroundColor) !== null
    ? rootStyle.backgroundColor
    : (rootStyle.colorScheme.trim() === "dark" ? "rgb(18, 18, 18)" : "rgb(255, 255, 255)");
  const backdrop = harnessLuminance(backdropColor);
  // Primary, secondary, and tertiary (dim cells, completed rows, queue
  // positions) text, wherever the fixture renders them.
  const selectors = [
    ".mrw-tool", ".mrw-empty-title", ".mrw-empty-sub", ".mrw-error-title",
    ".mrw-td-dim", "tr.mrw-row-done td", ".mrw-td-pos"
  ];
  const ratios = {};
  for (const selector of selectors) {
    const node = doc.querySelector(selector);
    if (!node) continue;
    const text = harnessLuminance(getComputedStyle(node).color, backdropColor);
    ratios[selector] = text === null ? 0 :
      Math.round((Math.max(text, backdrop) + 0.05) / (Math.min(text, backdrop) + 0.05) * 100) / 100;
  }
  return ratios;
}

// The style variables the harness host sends; see `hostVariant`.
function harnessHostVariables() {
  const dark = hostVariant === "mismatch" ? theme !== "dark" : theme === "dark";
  const variables = dark
    ? { "--color-text-primary": "rgb(244, 244, 245)", "--color-text-secondary": "rgb(161, 161, 170)" }
    : { "--color-text-primary": "rgb(24, 24, 27)", "--color-text-secondary": "rgb(82, 82, 91)" };
  if (hostVariant === "lowsecondary") {
    // Right polarity for the theme, but 2.17:1 (dark) and about 4:1 (light).
    Object.assign(variables, dark
      ? { "--color-text-primary": "#f5f5f7", "--color-text-secondary": "#777777", "--color-background-primary": "#444444" }
      : { "--color-text-primary": "#1d1d1f", "--color-text-secondary": "#757575", "--color-background-primary": "#f0f0f0" });
  } else if (hostVariant === "unmeasurable") {
    variables["--color-text-secondary"] = dark ? "rgba(255, 255, 255, 0.2)" : "rgba(0, 0, 0, 0.2)";
  }
  variables["--font-sans"] = "-apple-system, BlinkMacSystemFont, sans-serif";
  return variables;
}

function inspectWidget() {
  const doc = iframe.contentDocument;
  if (!doc || !doc.querySelector(".mrw-card")) return { ready: false };
  const root = doc.documentElement;
  const body = doc.body;
  const scrollers = Array.from(doc.querySelectorAll(".mrw-scroll"));
  const cardStyle = getComputedStyle(doc.querySelector(".mrw-card"));
  const rows = Array.from(doc.querySelectorAll("tr.mrw-data-row"));
  const tableRect = doc.querySelector(".mrw-table")?.getBoundingClientRect();
  const widgetRect = doc.querySelector(".mrw")?.getBoundingClientRect();
  const prominentCounts = rows.map(row => row.querySelectorAll(".mrw-check, .mrw-action-primary").length);
  const openOverflow = doc.querySelector("details.mrw-action-overflow[open]");
  const openMenuParticipatesInLayout = !openOverflow ||
    openOverflow.getBoundingClientRect().height > openOverflow.querySelector("summary").getBoundingClientRect().height;
  const styleSource = Array.from(doc.querySelectorAll("style")).map(style => style.textContent).join("\n");
  const frameHeight = parseFloat(iframe.style.height) || 0;
  const interactiveControls = Array.from(doc.querySelectorAll("button, summary, input, select, a[href]"))
    .filter(node => node.getClientRects().length > 0 && getComputedStyle(node).visibility !== "hidden");
  const toolActionControls = doc.querySelectorAll("[data-mrw-action-id], [data-mrw-run-again]").length;
  const controlsWithinViewport = interactiveControls.every(node => {
    const rect = node.getBoundingClientRect();
    return rect.left >= -1 && rect.right <= iframe.contentWindow.innerWidth + 1;
  });
  const outOfBoundsControls = interactiveControls.flatMap(node => {
    const rect = node.getBoundingClientRect();
    if (rect.left >= -1 && rect.right <= iframe.contentWindow.innerWidth + 1) return [];
    return [{
      label: node.getAttribute("aria-label") || node.textContent.trim().slice(0, 40),
      left: Math.round(rect.left * 10) / 10,
      right: Math.round(rect.right * 10) / 10
    }];
  });

  return {
    ready: true,
    initialized: window.__initialized,
    fixture: fixtureName,
    theme,
    requestedWidth: frameWidth,
    zoomPercent,
    supportsServerTools,
    supportsOpenLinks,
    exercise,
    widgetViewportWidth: iframe.contentWindow.innerWidth,
    renderedRows: rows.length,
    totalRows: fixtureName === "dense" ? DENSE_REMINDERS.length : rows.length,
    noHorizontalOverflow: root.scrollWidth <= root.clientWidth + 1 && body.scrollWidth <= body.clientWidth + 1,
    rootWidth: [root.scrollWidth, root.clientWidth],
    bodyWidth: [body.scrollWidth, body.clientWidth],
    tableWidth: tableRect ? Math.round(tableRect.width * 10) / 10 : null,
    widgetWidth: widgetRect ? Math.round(widgetRect.width * 10) / 10 : null,
    noNestedOverflow: scrollers.every(node => {
      const style = getComputedStyle(node);
      return style.maxHeight === "none" && style.overflowX === "visible" && style.overflowY === "visible";
    }),
    noEmbeddedBrand: !doc.querySelector(".mrw-brand"),
    noCustomGradient: !/(?:linear|radial|conic)-gradient\s*\(/i.test(styleSource),
    hostOwnsCardChrome: cardStyle.borderTopWidth === "0px" && cardStyle.boxShadow === "none",
    interactiveControlsWithinViewport: controlsWithinViewport,
    outOfBoundsControls,
    maxProminentActions: prominentCounts.length ? Math.max(...prominentCounts) : 0,
    overflowMenus: doc.querySelectorAll("details.mrw-action-overflow").length,
    overflowActions: doc.querySelectorAll(".mrw-action-menu .mrw-rowbtn").length,
    openMenuParticipatesInLayout,
    // Fractional layout and iframe zoom can differ by up to two physical
    // pixels after a host theme/style update.
    contentFitsFrame: root.scrollHeight <= frameHeight + 2,
    sizeEventCount: window.__sizeEvents.length,
    sizeEventsValid: window.__sizeEvents.length > 0 &&
      window.__sizeEvents.every(params =>
        params &&
        Number.isFinite(params.width) && params.width > 0 &&
        Number.isFinite(params.height) && params.height > 0
      ),
    toolActionControls,
    openLinks: window.__openLinks.slice(),
    linkModes: Array.from(doc.querySelectorAll(".mrw-link"))
      .map(link => link.dataset.mrwLinkMode),
    linkHrefs: Array.from(doc.querySelectorAll(".mrw-link"))
      .map(link => link.getAttribute("href")),
    linkTitles: Array.from(doc.querySelectorAll(".mrw-link"))
      .map(link => link.getAttribute("title")),
    attachmentHrefs: Array.from(doc.querySelectorAll(".mrw-attachment"))
      .map(node => node.getAttribute("href")),
    attachmentTitles: Array.from(doc.querySelectorAll(".mrw-attachment"))
      .map(node => node.getAttribute("title")),
    toolCalls: window.__toolCalls.slice(),
    teardownAck: window.__teardownAck,
    unknownMethodError: window.__unknownMethodError,
    widgetErrors: window.__widgetErrors.slice(),
    cancelledSafe: window.__cancelledSafe,
    jsonValuesSafe: window.__jsonValuesSafe,
    sortRowsSafe: window.__sortRowsSafe,
    invalidResultsIgnored: window.__invalidResultsIgnored,
    // grouped-sections + change states
    sectionTitles: Array.from(doc.querySelectorAll(".mrw-section-title")).map(n => n.textContent),
    sectionCounts: Array.from(doc.querySelectorAll(".mrw-section-count")).map(n => n.textContent),

    artworkTiles: Array.from(doc.querySelectorAll(".mrw-art")).map(node => {
      const rect = node.getBoundingClientRect();

          rect.width > 0 && rect.height > 0
      };
    }),
    episodeCards: doc.querySelectorAll(".mrw-episode").length,
    queuePositions: Array.from(doc.querySelectorAll("tr.mrw-data-row .mrw-td-pos")).map(n => n.textContent),
    markedRows: doc.querySelectorAll("tr.mrw-row-marked").length,

    emptySub: doc.querySelector(".mrw-empty-sub")?.textContent || null,
    oversizedPanels: doc.querySelectorAll(".mrw-oversized").length,
    truncationBanners: doc.querySelectorAll(".mrw-truncated").length,
    partialOutputDisclosures: doc.querySelectorAll(".mrw-oversized details").length,
    changeHeadline: doc.querySelector(".mrw-change-title")?.textContent || null,
    changeSubtitle: doc.querySelector(".mrw-change-sub")?.textContent || null,
    changeSummary: doc.querySelector(".mrw-change-summary")?.textContent || null,
    previewChip: doc.querySelectorAll(".mrw-preview").length,
    cardStatus: doc.querySelector(".mrw-card")?.dataset.status || null,
    statusLabel: doc.querySelector(".mrw-chip")?.textContent || null,
    warningPanels: doc.querySelectorAll(".mrw-warning").length,
    warningTitle: doc.querySelector(".mrw-warning-title")?.textContent || null,
    warningMessages: Array.from(doc.querySelectorAll(".mrw-warning-list li")).map(n => n.textContent),
    documentTitle: doc.querySelector(".mrw-document-title")?.textContent || null,
    documentBodyText: doc.querySelector(".mrw-document-body")?.textContent || null,
    documentItems: doc.querySelectorAll(".mrw-document-item").length,
    documentItemStatuses: Array.from(doc.querySelectorAll(".mrw-document-item-status")).map(n => n.textContent),
    documentItemBodies: Array.from(doc.querySelectorAll(".mrw-document-item-body")).map(n => n.textContent),
    documentDangerousNodes: doc.querySelectorAll(".mrw-document script, .mrw-document a, .mrw-document b, .mrw-document-item script").length,
    errorPanels: doc.querySelectorAll(".mrw-error").length,
    errorTitle: doc.querySelector(".mrw-error-title")?.textContent || null,
    stderrText: doc.querySelector(".mrw-stderr")?.textContent || null,
    recurrenceCells: Array.from(doc.querySelectorAll('[data-key="recurrence"]')).map(n => n.textContent),
    flagCells: Array.from(doc.querySelectorAll('[data-key="flag"]')).map(n => n.textContent),
    cardTitle: doc.querySelector(".mrw-episode-title")?.textContent || null,
    cardSubtitle: doc.querySelector(".mrw-episode-sub")?.textContent || null,
    cardMeta: doc.querySelector(".mrw-episode-meta")?.textContent || null,
    hasTable: !!doc.querySelector(".mrw-table"),
    hasTree: !!doc.querySelector(".mrw-tree"),
    hasTerminal: !!doc.querySelector(".mrw-term"),
    summaryPanels: doc.querySelectorAll(".mrw-summary").length,
    taskPanels: doc.querySelectorAll(".mrw-task").length,
    attachmentNames: Array.from(doc.querySelectorAll(".mrw-attachment-name")).map(n => n.textContent),
    relatedTexts: Array.from(doc.querySelectorAll(".mrw-rich-text")).map(n => n.textContent),
    // The single most developer-facing string a curated view can print. No
    // fixture, in any state, may ever contain it.
    objectObject: (doc.querySelector(".mrw-card")?.textContent || "").includes("[object Object]"),
    sortControls: doc.querySelectorAll(".mrw-th-btn[type='button'], .mrw-sort-select").length,
    hostTheme: root.dataset.mrwTheme || null,
    hostColors: root.dataset.mrwHostColors || null,
    rootColorScheme: getComputedStyle(root).colorScheme.trim(),
    textContrast: widgetTextContrast(doc),
    displayMode: root.dataset.mrwDisplayMode || null,
    platform: root.dataset.mrwPlatform || null,
    safeTop: root.style.getPropertyValue("--mrw-safe-top"),
    hostTextColor: root.style.getPropertyValue("--color-text-primary"),
    hostFontsInstalled: !!doc.getElementById("mrw-host-fonts")?.textContent,
    accentLineColor: getComputedStyle(doc.querySelector(".mrw-accent")).backgroundColor,
    renderedText: doc.querySelector(".mrw-card")?.textContent || "",

let inspectionTimer = null;
function scheduleInspection() {
  clearTimeout(inspectionTimer);
  inspectionTimer = setTimeout(updateAssertions, 80);
}

window.__harnessReport = inspectWidget;
window.__openLastOverflow = () => {
  const doc = iframe.contentDocument;
  const menus = doc ? Array.from(doc.querySelectorAll("details.mrw-action-overflow")) : [];
  if (!menus.length) return false;
  menus[menus.length - 1].open = true;
  scheduleInspection();
  return true;
};

window.addEventListener("message", (event) => {
  if (event.source !== iframe.contentWindow) { return; }
  const msg = event.data;
  if (!msg || msg.jsonrpc !== "2.0") { return; }
  const send = (m) => iframe.contentWindow.postMessage(m, "*");

  if (msg.method === "ui/initialize") {
    const hostCapabilities = {};
    if (supportsServerTools) hostCapabilities.serverTools = {};
    if (supportsOpenLinks) hostCapabilities.openLinks = {};
    send({ jsonrpc: "2.0", id: msg.id, result: {
      protocolVersion: "2026-01-26",
      hostInfo: { name: "HarnessHost", version: "1.0" },
      hostCapabilities,
      hostContext: {
        theme: hostVariant === "themeless" ? undefined : theme,
        platform: "web",
        displayMode: "inline",
        containerDimensions: { width: frameWidth, maxHeight: 4000 },
        safeAreaInsets: { top: 3, right: 4, bottom: 5, left: 6 },
        // A real host hands down variables that match the theme it just
        // declared. Sending light text colors with `theme: "dark"` made every
        // dark screenshot unreadable and told the widget nothing true; the
        // `mismatch` variant does it on purpose to prove the widget copes.
        styles: {
          variables: harnessHostVariables(),
          css: {
            fonts: "@font-face { font-family: HarnessHost; src: local(-apple-system); }"
          }
        }
      }
    }});
    return;
  }
  if (msg.method === "ui/notifications/initialized") {
    window.__initialized = true;
    if (exercise === "malformed") {
      send("not-an-object");
      send({ jsonrpc: "1.0", method: "ui/notifications/tool-result", params: {} });
      send({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: "bad" });
      send({ jsonrpc: "2.0", id: 777, method: "host/unknown", params: {} });
    }
    send({ jsonrpc: "2.0", method: "ui/notifications/tool-input", params: { arguments: { days: 7 } } });
    if (exercise === "compatibility" || exercise === "compatmetadata") {
      const fixture = FIXTURES[fixtureName];
      const realm = iframe.contentWindow;
      realm.openai = realm.JSON.parse(JSON.stringify({toolOutput: fixture.structuredContent || JSON.parse(fixture.content[0].text), toolResponseMetadata: fixture._meta}));
      if (exercise === "compatmetadata") send({jsonrpc: "2.0", method: "ui/notifications/tool-result", params: {...fixture, _meta: {}}});
      realm.dispatchEvent(new realm.Event("openai:set_globals"));
    } else {
      send({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: FIXTURES[fixtureName] });
    }
    scheduleExercise();
    scheduleInspection();
    return;
  }
  if (msg.method === "ui/notifications/size-changed") {
    window.__sizeEvents.push(msg.params);
    if (msg.params && msg.params.height) { iframe.style.height = msg.params.height + "px"; }
    scheduleInspection();
    return;
  }
  if (msg.method === "tools/call") {
    window.__toolCalls.push(msg.params);
    // fixture=actionfail: every proxied call fails with a CLI-style stderr,
    // exercising the widget's visible Failed state + tooltip.
    const fail = fixtureName === "actionfail";
    setTimeout(() => {
      send({ jsonrpc: "2.0", id: msg.id, result: {
        structuredContent: envelope({
          toolName: msg.params.name,
          exitCode: fail ? 2 : 0, succeeded: !fail,
          stdout: fail ? "" : "{\"ok\": true}",
          stderr: fail ? "usage: remctl [-h] ...\nremctl: error: unrecognized arguments: --json" : ""
        }),
        content: [{ type: "text", text: fail ? "{}" : "{\"ok\": true}" }],
        isError: fail
      }});
      scheduleInspection();
    }, 250);
    return;
  }
  if (msg.method === "ui/open-link") {
    window.__openLinks.push(msg.params && msg.params.url);
    send({ jsonrpc: "2.0", id: msg.id, result: {} });
    scheduleInspection();
    return;
  }
  if (msg.id === 777 && msg.error) {
    window.__unknownMethodError = msg.error.code;
    scheduleInspection();
    return;
  }
  if (msg.id === 778 && msg.result) {
    window.__teardownAck = true;
    scheduleInspection();
  }
});

function scheduleExercise() {
  setTimeout(() => {
    const doc = iframe.contentDocument;
    if (!doc) return;
    if (exercise === "link") {
      const link = doc.querySelector(".mrw-link");
      if (link) link.click();
    } else if (exercise === "copy") {
      doc.execCommand = () => {
        window.__copiedText = doc.activeElement && "value" in doc.activeElement
          ? doc.activeElement.value : null;

      };
      const copy = Array.from(doc.querySelectorAll("button"))
        .find(button => button.textContent.includes("Copy result"));
      if (copy) copy.click();
    } else if (exercise === "context") {
      const nextTheme = theme === "dark" ? "light" : "dark";
      iframe.contentWindow.postMessage({
        jsonrpc: "2.0",

              structuredContent: current.value
            }
          }, "*");
          setTimeout(() => {
            const text = doc.querySelector(".mrw-card")?.textContent || "";
            const casePassed =
              !!doc.querySelector(".mrw-card[data-status='success']") &&
              text.includes("Completed") &&
              current.forbidden.every(marker => !text.includes(marker)) &&
              !text.includes("content-fallback-must-not-win");
            allVisible = allVisible &&
              casePassed;
            renderNext();
          }, 35);
          return;
        }

        iframe.contentWindow.postMessage({
          jsonrpc: "2.0",
          method: "ui/notifications/tool-result",
          params: {
            content: [{ type: "text", text: "content-only-fallback" }]
          }
        }, "*");
        setTimeout(() => {
          const text = doc.querySelector(".mrw-card")?.textContent || "";
          const contentOnlyPassed =
            !!doc.querySelector(".mrw-card[data-status='success']") &&
            text.includes("Completed") &&
            !text.includes("content-only-fallback");
          window.__jsonValuesSafe = allVisible &&
            contentOnlyPassed;
          iframe.contentWindow.postMessage({
            jsonrpc: "2.0",
            method: "ui/notifications/tool-result",
            params: FIXTURES[fixtureName]
          }, "*");
          scheduleInspection();
        }, 35);
      };
      renderNext();
    } else if (exercise === "jsoninvalid") {
      const baseline = doc.querySelector(".mrw-card")?.textContent || "";
      const invalidValues = [
        undefined,
        NaN,
        Infinity,
        -Infinity,
        [1, undefined]
      ];
      const cycle = {};
      cycle.self = cycle;
      invalidValues.push(cycle);
      let index = 0;
      let stayedStable = !!baseline;

      const dispatchRealmResult = (value, text) => {
        const realm = iframe.contentWindow;
        const block = new realm.Object();
        block.type = "text";
        block.text = text;
        const content = new realm.Array();
        content.push(block);
        const result = new realm.Object();
        result.content = content;
        result.structuredContent = value;
        const message = new realm.Object();
        message.jsonrpc = "2.0";
        message.method = "ui/notifications/tool-result";
        message.params = result;
        realm.dispatchEvent(new realm.MessageEvent("message", {
          data: message,
          source: window
        }));
      };

      const rejectNext = () => {
        if (index < invalidValues.length) {
          iframe.contentWindow.postMessage({
            jsonrpc: "2.0",
            method: "ui/notifications/tool-result",
            params: {
              content: [{ type: "text", text: "invalid-value" }],
              structuredContent: invalidValues[index++]
            }
          }, "*");
          setTimeout(() => {
            stayedStable = stayedStable &&
              doc.querySelector(".mrw-card")?.textContent === baseline;
            rejectNext();
          }, 30);
          return;
        }

        // A valid control proves that the synthetic MessageEvent reaches the
        // widget before the uncloneable function is injected through it.
        dispatchRealmResult("synthetic-control", "synthetic-control-fallback");
        setTimeout(() => {
          const syntheticDelivered =
            (doc.querySelector(".mrw-card")?.textContent || "").includes("Completed") &&
            !doc.querySelector(".mrw-table");
          iframe.contentWindow.postMessage({
            jsonrpc: "2.0",
            method: "ui/notifications/tool-result",
            params: FIXTURES[fixtureName]
          }, "*");
          setTimeout(() => {
            stayedStable = stayedStable &&
              doc.querySelector(".mrw-card")?.textContent === baseline;
            dispatchRealmResult(
              iframe.contentWindow.Function("return 1"),
              "invalid-function"
            );
            setTimeout(() => {
              stayedStable = stayedStable &&
                doc.querySelector(".mrw-card")?.textContent === baseline;
              window.__invalidResultsIgnored = stayedStable && syntheticDelivered;
              scheduleInspection();
            }, 30);
          }, 30);
        }, 30);
      };
      rejectNext();
    }
    scheduleInspection();
  }, 180);
}
</script>
