      sortDirection.title = sortDirection.getAttribute('aria-label');
    }

    function cellNode(spec, row) {
      const value = spec.value(row);
      const cls = [spec.tdClass || '', spec.isNumeric ? 'mrw-td-num' : '', spec.primary ? 'mrw-td-primary' : ''].join(' ').trim();
      let td;
      if (value == null) td = el('td', (cls + ' mrw-td-dim').trim(), '—');
      else if (value.nodeType) td = el('td', cls || null, value);
      else if (typeof value === 'object') td = el('td', (cls + ' mrw-td-dim').trim(), '—');
      else {
        const safe = safeScalar(value);
        td = el('td', safe == null ? (cls + ' mrw-td-dim').trim() : (cls || null), safe || '—');
      }
      td.dataset.label = spec.title || '';
      td.dataset.key = spec.key;
      return td;
    }

    function paintRows() {
      const ordered = rows.slice();
      if (sort.key && specByKey[sort.key]) {
        const sv = specByKey[sort.key].sortValue;
        // Project each row once; comparisons reuse the same locale settings.
        const values = new Map(rows.map(row => [row, sv(row)]));
        const compare = new Intl.Collator(undefined, { numeric: true }).compare;
        ordered.sort((a, b) => {
          const av = values.get(a), bv = values.get(b);
          if (av == null || av === '') return 1; if (bv == null || bv === '') return -1;
          if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sort.dir;
          return compare(String(av), String(bv)) * sort.dir;
        });
      }
      tbody.textContent = '';
      for (const row of ordered.slice(0, visibleCount)) {
        const tr = el('tr', 'mrw-data-row');
        const index = rowIndex.get(row);
        const rowSt = actionState.get(index) || {};
        const primary = columns.find(spec => spec.primary) || columns[0];
        const rowLabel = primary && fieldValue(row, primary.key) != null
          ? (safeScalar(fieldValue(row, primary.key)) || 'row ' + (index + 1))
          : 'row ' + (index + 1);
        if (checkActions.length) tr.classList.add('mrw-row-has-check');
        if (columns.some(spec => spec.tdClass === 'mrw-td-art')) tr.classList.add('mrw-row-has-art');
        if (isMarked(row)) tr.classList.add('mrw-row-marked');
        if (numbered) {
          tr.classList.add('mrw-row-has-pos');
          const td = el('td', 'mrw-td-pos', String(index + 1));
          td.dataset.label = '#';
          tr.append(td);
        }

        if (checkActions.length) {
          const act = checkActions[0];
          const applies = !p.actionApplies || p.actionApplies(act, row);
          const alreadyDone = !!(p.isRowCompleted && p.isRowCompleted(row));
          if (!applies) { tr.append(el('td', 'mrw-td-check')); }
          else {
          const btn = el('button', 'mrw-check');
          btn.type = 'button';
          btn.title = act.title || 'Mark complete';
          btn.dataset.mrwActionId = act.id;
          btn.setAttribute('aria-label', (act.title || 'Mark complete') + ': ' + rowLabel);
          btn.append(I.check());
          btn.dataset.state = alreadyDone ? 'done' : (rowSt[act.id] || '');
          if (alreadyDone || rowSt[act.id] === 'done') tr.classList.add('mrw-row-done');
          btn.addEventListener('click', () => {
            if (btn.dataset.state) return;
            btn.dataset.state = 'pending';
            setRowState(row, act.id, 'pending');
            invoke(act.id, row).then(() => {
              btn.dataset.state = 'done';
              setRowState(row, act.id, 'done');
              tr.classList.add('mrw-row-done');
            }).catch((err) => {
              // A silent reset reads as "the button does nothing" — flash
              // the failure and carry the reason in the tooltip.
              btn.dataset.state = 'failed'; setRowState(row, act.id, '');
              btn.title = actionFailureTitle(err, act.title || 'Mark complete');
              setTimeout(() => { if (btn.dataset.state === 'failed') { btn.dataset.state = ''; } }, 3000);
            });
          });
          tr.append(el('td', 'mrw-td-check', btn));
          }
        }

        columns.forEach((spec) => tr.append(cellNode(spec, row)));

        if (buttonActions.length) {
          const td = el('td', 'mrw-td-actions');
          td.dataset.label = 'Actions';
          const applicable = buttonActions.filter(act => !p.actionApplies || p.actionApplies(act, row));
          const visibleLimit = Math.max(0, 2 - Math.min(checkActions.length, 1));
          td.append(renderActionGroup(applicable, (act) => ({
              initialState: rowSt[act.id] || '',
              run: (values) => invoke(act.id, row, values),
              onState: (s) => setRowState(row, act.id, s),
              requestInputs: (fire) => toggleInputForm(tr, act, row, fire)
            }), visibleLimit));
          tr.append(td);
        }
        tbody.append(tr);
      }
      const remaining = Math.max(0, rows.length - visibleCount);
      more.hidden = remaining === 0;
      if (remaining) {
        const next = Math.min(pageSize, remaining);
        moreButton.textContent = 'Show ' + next + ' more';
        moreButton.title = remaining + (remaining === 1 ? ' row remains' : ' rows remain');
        moreButton.setAttribute('aria-label', 'Show ' + next + ' more; ' + remaining + ' remaining');
      }
    }
    function setRowState(row, actionId, s) {
      const index = rowIndex.get(row);
      const cur = actionState.get(index) || {};
      cur[actionId] = s; actionState.set(index, cur);
    }
    function invoke(actionId, row, inputValues) {
      const clean = { ...row };
      return p.onAction ? Promise.resolve(p.onAction(actionId, clean, inputValues || {})) : Promise.resolve();
    }

    /* Inline input row (reschedule/edit): expands beneath the acted-on row,
       prefilled from it, Enter or Apply to fire. */
    function toggleInputForm(tr, act, row, fire) {
      const existing = tr.nextElementSibling;
      if (existing && existing.classList.contains('mrw-inputrow')) { existing.remove(); return; }
      tbody.querySelectorAll('tr.mrw-inputrow').forEach(n => n.remove());
      const formTr = el('tr', 'mrw-inputrow');
      const td = el('td'); td.colSpan = 99;
      const built = buildInputForm(act, row, fire, () => formTr.remove());
      td.append(built.form); formTr.append(td);
      tr.after(formTr);
      built.focus();
    }

    table.append(thead, tbody);
    if (sortable) wrap.append(mobileSort);
    wrap.append(table, more);
    syncSortControls();
    paintRows();
    return wrap;
  }

  /* ════════ shared action affordances (table rows + episode card) ════════ */
  function actionFailureTitle(err, actionTitle) {
    return actionTitle + ' failed. Check MacRemote on the Mac for details.';
  }

  /* One action button: idle → pending → done, destructive two-step arm,
     visible Failed state with the reason in the tooltip (never a silent
     reset), optional inline inputs collected before firing. */
  function actionButton(act, opts) {
    const b = el('button', 'mrw-rowbtn' + (act.style === 'destructive' ? ' mrw-destructive' : ''));
    b.type = 'button';
    b.dataset.mrwActionId = act.id;
    b.dataset.state = opts.initialState || '';
    const label = () => {
      b.textContent = '';
      if (b.dataset.state === 'pending') { b.append(I.spinner(), act.label || 'Run'); }
      else if (b.dataset.state === 'done') { b.append(I.checkTint(), act.doneLabel || 'Done'); }
      else if (b.dataset.state === 'armed') { b.append('Confirm?'); }
      else if (b.dataset.state === 'failed') { b.append('Failed'); }
      else b.append(act.label || 'Run');
    };
    label();
    const fire = (inputValues) => {
      b.dataset.state = 'pending';
      if (opts.onState) opts.onState('pending');
      label();
      Promise.resolve(opts.run(inputValues || {})).then(() => {
        b.dataset.state = 'done';
        if (opts.onState) opts.onState('done');
        label();
      }).catch((err) => {
        b.dataset.state = 'failed';
        if (opts.onState) opts.onState('');
        label();
        b.title = actionFailureTitle(err, act.label || 'Run');
        setTimeout(() => {
          if (b.dataset.state === 'failed') { b.dataset.state = ''; label(); }
        }, 3500);
      });
    };
    b.addEventListener('click', () => {
      if (b.dataset.state === 'pending' || b.dataset.state === 'done') return;
      if (act.inputs && act.inputs.length && opts.requestInputs) { opts.requestInputs(fire); return; }
      if (act.style === 'destructive') {
        if (b.dataset.state !== 'armed') {
          b.dataset.state = 'armed'; label();
          setTimeout(() => {
            if (b.dataset.state === 'armed') { b.dataset.state = ''; label(); }
          }, 3500);
          return;
        }
        b.dataset.state = '';
      }
      fire();
    });
    return b;
  }

  /* Keep the surface calm without dropping capabilities: at most two
     actions are prominent, and every additional action stays available in
     a native disclosure that expands the document (and therefore the host
     iframe) instead of floating beyond its measured bounds. */
  function renderActionGroup(actions, optionsFor, visibleLimit) {
    const group = el('div', 'mrw-action-group');
    const limit = Math.max(0, visibleLimit == null ? 2 : visibleLimit);
    for (const act of actions.slice(0, limit)) {
      const button = actionButton(act, optionsFor(act));
      button.classList.add('mrw-action-primary');
      group.append(button);
    }

    const overflow = actions.slice(limit);
    if (!overflow.length) return group;

    const details = el('details', 'mrw-action-overflow');
    details.dataset.mrwActionOverflow = String(overflow.length);
    const summary = el('summary');
    summary.setAttribute('aria-label', 'More actions, ' + overflow.length + ' available');
    summary.append('More', I.chevron());
    const menu = el('div', 'mrw-action-menu');
    menu.setAttribute('aria-label', 'More actions');

    for (const act of overflow) {
      const options = optionsFor(act);
      if (options.requestInputs) {
        const requestInputs = options.requestInputs;
        options.requestInputs = (fire) => {
          details.open = false;
          requestInputs(fire);
        };
      }
      menu.append(actionButton(act, options));
    }
    details.append(summary, menu);
    details.addEventListener('toggle', () => {
      if (!details.open) return;
      document.querySelectorAll('details.mrw-action-overflow[open]').forEach(other => {
        if (other !== details) other.open = false;
      });
    });
    details.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      details.open = false;
      summary.focus();
      event.stopPropagation();
    });
    group.append(details);
    return group;
  }

  /* Inline input form (reschedule/edit): prefilled from the row, Enter or
     the apply button fires, Cancel closes. The host (table/card) decides
     where the form element lives. */
  function buildInputForm(act, row, fire, close) {
    const form = el('div', 'mrw-inputform');
    const fields = {};
    const go = el('button', 'mrw-rowbtn');
    for (const inp of (act.inputs || [])) {
      const wrap = el('label', 'mrw-inputlabel', inp.title);
      const input = document.createElement('input');
      input.className = 'mrw-input'; input.type = 'text';
      input.placeholder = inp.placeholder || '';
      if (inp.prefillField && row[inp.prefillField] != null) input.value = String(row[inp.prefillField]);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go.click(); });
      fields[inp.name] = input;
      wrap.append(input); form.append(wrap);
    }
    go.type = 'button'; go.textContent = act.label || 'Apply';
    const cancel = el('button', 'mrw-rowbtn'); cancel.type = 'button'; cancel.textContent = 'Cancel';
    cancel.addEventListener('click', () => close());
    go.addEventListener('click', () => {
      const values = {};
      for (const k of Object.keys(fields)) { values[k] = fields[k].value; }
      close();
      fire(values);
    });
    form.append(go, cancel);
    return {
      form,
      focus: () => { const first = Object.values(fields)[0]; if (first) first.focus(); }
    };
  }

  /* ════════ CARD state — one curated row rendered as an episode card ════════ */
  // A lone object (e.g. "now playing") whose primary curated field is
  // present gets the card treatment instead of the raw key/value tree.
  function cardRowFrom(j, p) {
    if (!j || typeof j !== 'object' || Array.isArray(j)) return null;
    if (!Array.isArray(p.columns) || !p.columns.length) return null;
    const primary = p.columns.find(c => c.primary);
    if (!primary || j[primary.key] == null || j[primary.key] === '') return null;
    return j;
  }

  // One-line text for a card field. An object value has no honest flat form, so
  // it gets the same short JSON slice a table cell gives it — never String(v)'s
  // "[object Object]", which is the single most developer-facing thing a
  // curated card can say.
  function cardText(v) {
    if (v !== null && typeof v === 'object') {
      if (v.nodeType) return v.textContent || '—';
      return '—';
    }
    return safeScalar(v) || '—';
  }

  function renderCard(p, row) {
    const specs = columnSpecsFor(p, [row]);
    const art = specs.find(s => s.tdClass === 'mrw-td-art');
    const primary = specs.find(s => s.primary) || specs[0];
    // A record with nothing renderable (an empty object reaching a card group)
    // must not take the card path down with it.
    if (!primary) return el('div', 'mrw-episode');
    const rest = specs.filter(s => s !== art && s !== primary);

    const card = el('div', 'mrw-episode');
    if (art) {
      const img = art.value(row);
      if (img && img.nodeType) { img.classList.add('mrw-episode-art'); card.append(img); }
    }
    const main = el('div', 'mrw-episode-main');
    const titles = el('div', null);
    const rawTitle = primary.rawValue ? primary.rawValue(row) : primary.value(row);
    titles.append(el('div', 'mrw-episode-title', rawTitle == null ? '—' : cardText(rawTitle)));
    const sub = primary.subtitle && primary.subtitle(row);
    const safeSub = safeScalar(sub);
    if (safeSub) titles.append(el('div', 'mrw-episode-sub', safeSub));
    main.append(titles);

    const meta = el('div', 'mrw-episode-meta');
    for (const spec of rest) {
      const v = spec.value(row);
      if (v == null || v === '') continue;
      if (meta.childNodes.length) meta.append(el('span', 'mrw-episode-dot', '·'));
      meta.append(v.nodeType ? v : document.createTextNode(cardText(v)));
    }
    if (meta.childNodes.length) main.append(meta);

    const acts = (p.rowActions || []).filter(a => !p.actionApplies || p.actionApplies(a, row));
    if (acts.length && p.onAction) {
      const box = el('div', 'mrw-episode-actions');
      box.append(renderActionGroup(acts, (act) => ({
          run: (values) => Promise.resolve(p.onAction(act.id, { ...row }, values || {})),
          requestInputs: (fire) => {
            const existing = box.querySelector('.mrw-inputform');
            if (existing) { existing.remove(); return; }
            const built = buildInputForm(act, row, fire, () => built.form.remove());
            box.append(built.form);
            built.focus();
          }
        }), 2));
      main.append(box);
    }
    card.append(main);
    return card;
  }

  /* ════════ DOCUMENT state — readable Markdown-like text, safely escaped ════════ */
  function renderDocument(p, document) {
    const scroll = el('div', 'mrw-scroll');
    const article = el('article', 'mrw-document');
    if (document.title) article.append(el('div', 'mrw-document-title', document.title));
    const body = el('div', 'mrw-document-body');
    const lines = document.body.replace(/\r\n?/g, '\n').split('\n');
    let paragraph = [];
    let list = null;
    let code = null;
    const flushParagraph = () => {
      if (!paragraph.length) return;
      body.append(el('p', null, paragraph.join(' ').trim()));
      paragraph = [];
    };
    const flushList = () => { if (list) { body.append(list); list = null; } };
    const flushCode = () => {
      if (!code) return;
      body.append(el('pre', 'mrw-document-code', code.join('\n')));
      code = null;
    };
    for (const line of lines) {
      if (/^\s*```/.test(line)) {
        flushParagraph(); flushList();
        if (code) flushCode(); else code = [];
        continue;
      }
      if (code) { code.push(line); continue; }
      if (!line.trim()) { flushParagraph(); flushList(); continue; }
      const heading = line.match(/^#{1,6}\s+(.+)$/);
      if (heading) {
        flushParagraph(); flushList();
        body.append(el('h3', null, heading[1].trim()));
        continue;
      }
      const quote = line.match(/^>\s?(.*)$/);
      if (quote) {
        flushParagraph(); flushList();
        body.append(el('blockquote', null, quote[1]));
        continue;
      }
      const bullet = line.match(/^\s*[-*+]\s+(?:\[[ xX]\]\s*)?(.*)$/);
      if (bullet) {
        flushParagraph();
        if (!list) list = el('ul');
        list.append(el('li', null, bullet[1]));
        continue;
      }
      flushList();
      paragraph.push(line.trim());
    }
    flushParagraph(); flushList(); flushCode();
    article.append(body);
    scroll.append(article);
    return scroll;
  }

  /* ════════ GROUPED SECTIONS state ════════ */
  // One section: a small uppercase label + count, then either the first row as
  // an episode card (`style: "card"`) or the ordinary curated table.
  function sectionNode(p, section) {
    const node = el('section', 'mrw-section');
    const head = el('div', 'mrw-section-head', el('span', 'mrw-section-title', section.title));
    if (section.style !== 'card' || section.rows.length > 1) {
      head.append(el('span', 'mrw-section-count', String(section.rows.length)));
    }
    node.append(head);
    if (section.style === 'card') {
      node.append(renderCard(p, section.rows[0]));
    } else if (section.style === 'documentList') {
      node.append(renderDocumentList(section.rows, section.documentList));
    } else {
      node.append(renderTable(p, section.rows, {
        wrapClass: 'mrw-section-body',
        sortable: false,
        numbered: section.numbered === true,
        marked: section.marked || null
      }));
    }
    return node;
  }

  function renderDocumentList(rows, hint) {
    const list = el('div', 'mrw-document-list');
    const spec = isObject(hint) ? hint : {};
    rows.forEach((row, index) => {
      const item = el('article', 'mrw-document-item');
      const titleValue = firstFieldValue(row, spec.titleKey);
      const baseTitle = typeof spec.fallbackRowTitle === 'string'
        ? spec.fallbackRowTitle : 'Item';
      const title = typeof titleValue === 'string' && safeDisplayText(titleValue, { singleLine: true, maximum: 200 })
        ? safeDisplayText(titleValue, { singleLine: true, maximum: 200 }) : baseTitle + ' ' + (index + 1);
      let statusValue = firstFieldValue(row, spec.statusKey);
      if (spec.pendingKey && fieldValue(row, spec.pendingKey) === true &&
          typeof spec.pendingTitle === 'string') {
        statusValue = spec.pendingTitle;
      } else if (statusValue != null && isObject(spec.statusTitles) &&
                 typeof spec.statusTitles[String(statusValue)] === 'string') {
        statusValue = spec.statusTitles[String(statusValue)];
      }
      const head = el('div', 'mrw-document-item-head',
        el('div', 'mrw-document-item-title', title));
      const safeStatus = safeScalar(statusValue);
      if (safeStatus) {
        head.append(el('span', 'mrw-document-item-status', safeStatus));
      }
      item.append(head);
      const bodyValue = firstFieldValue(row, spec.bodyKey);
      const safeBody = safeDisplayText(bodyValue, { maximum: 12_000 });
      if (safeBody) {
        item.append(el('div', 'mrw-document-item-body', safeBody));
      }
      list.append(item);
    });
    return list;
  }

  function renderMetaChips(chips) {
    const box = el('div', 'mrw-meta-chips');
    for (const chip of chips) {
      box.append(el('span', 'mrw-meta-chip', el('span', null, chip.label), el('b', null, chip.value)));
    }
    return box;
  }

  function contextChipsFrom(j, p) {
    if (!isObject(j) || !Array.isArray(p.context)) return [];
    const chips = [];
    for (const spec of p.context) {
      if (!isObject(spec) || typeof spec.path !== 'string') continue;
      const value = fieldValue(j, spec.path);
      if (!isChipValue(value)) continue;
      const safeValue = safeScalar(value);
      if (!safeValue) continue;
      chips.push({
        label: typeof spec.title === 'string'
          ? (safeDisplayText(spec.title, { singleLine: true, maximum: 80 }) || 'Value')
          : (safeKeyLabel(spec.path) || 'Value'),
        value: safeValue
      });
    }
    return chips;
  }

  function renderSections(p, grouped) {
    if (!grouped.sections.length) return renderEmptyGroups(p, grouped);
    const scroll = el('div', 'mrw-scroll');
    for (const section of grouped.sections) scroll.append(sectionNode(p, section));
    if (grouped.chips.length) scroll.append(renderMetaChips(grouped.chips));
    return scroll;
  }

  // Every curated group came back empty: the same friendly, accent-tinted empty
  // language as a command with no output, on one line, naming the sections that
  // are empty. Never the raw key/value tree.
  function renderEmptyGroups(p, grouped) {
    const box = el('div', 'mrw-empty mrw-empty-groups');
    const icon = el('div', 'mrw-empty-icon'); icon.append(I.emptyCheck());
    box.append(icon, el('div', 'mrw-empty-title',
      'Nothing to show — ' + emptyGroupsSentence(grouped.empty)));
    if (grouped.chips.length) box.append(renderMetaChips(grouped.chips));
    return box;
  }

  /* ════════ CHANGE state ════════ */
  // A queue-changing command answers with a confirmation, not rows: an
  // accent-tinted headline (plus a Preview chip when nothing was applied yet),
  // the acted-on episode as a card, and the resulting queue numbered 1…N.
  function renderChange(p, info) {
    const scroll = el('div', 'mrw-scroll');
    const box = el('div', 'mrw-change');
    const icon = el('div', 'mrw-change-icon');
    icon.append(I.checkTint());
    const head = el('div', 'mrw-change-head', icon, el('div', 'mrw-change-title', info.headline));
    if (info.dryRun) {
      const chip = el('span', 'mrw-preview', 'Preview');
      chip.title = 'Nothing changed yet — this is what the command would do.';
      head.append(chip);
    }
    box.append(head);
    // "Reminder updated" alone is a confirmation of nothing in particular. When
    // no record card will carry the name, the hinted scalar title does.
    if (info.title && !(info.episode && cardRowFrom(info.episode, p))) {
      box.append(el('div', 'mrw-change-sub', info.title));
    }
    // Whenever no queue section will render — an older CLI build that answers
    // with only a count, a queue the command could not read back, or a genuinely
    // emptied queue (removing the last item) — state the count plainly rather
    // than leaving the result silent about the queue.
    if (!info.queue && info.count != null) {
      box.append(el('div', 'mrw-change-summary',
        info.count + ' ' + (info.count === 1 ? info.countNoun : info.countNounPlural) +
        ' in ' + info.queueTitle));
    }
    if (info.details.length) box.append(el('div', 'mrw-change-sub', [...new Set(info.details)].join(' · ')));
    if (info.warnings.length) box.append(renderWarnings(info.warnings));
    scroll.append(box);
    if (info.episode) scroll.append(renderCard(p, info.episode));
    if (info.queue) {
      scroll.append(sectionNode(p, {
        title: info.queueTitle,
        rows: info.queue,
        style: 'table',
        numbered: true,
        marked: info.marked
      }));
    }
    return scroll;
  }

  // Batch rendering is declared by catalog hints. Successful, uncertain, and
  // unchanged rows remain separate even when the outer call reports an error.
  function batchPayloadFrom(value, p) {
    const hint = p.change && p.change.batch;
    if (!isObject(hint) || !isObject(value)) return null;
    const rows = fieldValue(value, hint.rowsKey);
    if (!Array.isArray(rows) || !rows.length || !rows.every(isObject)) return null;
    const doneIDs = fieldValue(value, hint.succeededKey);
    const uncertainIDs = fieldValue(value, hint.uncertainKey);
    if (!Array.isArray(doneIDs) || !Array.isArray(uncertainIDs)) return null;
    const done = new Set(doneIDs.map(String));
    const uncertain = new Set(uncertainIDs.map(String));
    return {
      title: safeDisplayText((hint.titles || {})[fieldValue(value, hint.operationKey)] || 'Changed'),
      rows: rows.map(row => {
        const id = fieldValue(row, hint.idKey);
        const name = safeScalar(fieldValue(row, hint.titleKey));
        return { name: name || (typeof id === 'number' ? 'Item ' + id : 'Item'),
          state: uncertain.has(String(id)) ? 'uncertain' : done.has(String(id)) ? 'done' : 'unchanged',
          message: safeScalar(fieldValue(row, hint.messageKey)) };
      })
    };
  }

  function renderBatch(p, batch) {
    const box = el('div', 'mrw-change');
    const done = batch.rows.filter(row => row.state === 'done').length;
    box.append(el('div', 'mrw-change-title', batch.title + ': ' + done + ' of ' + batch.rows.length));
    for (const [state, title] of [['done', 'Changed'], ['uncertain', 'May have changed — check before retrying'], ['unchanged', 'Not changed']]) {
      const rows = batch.rows.filter(row => row.state === state);
      if (!rows.length) continue;
      const section = el('section', 'mrw-summary-section', el('div', 'mrw-summary-title', title));
      for (const row of rows) section.append(el('div', 'mrw-change-sub', row.name + (state !== 'done' && row.message ? ' · ' + row.message : '')));
      box.append(section);
    }
    return el('div', 'mrw-scroll', box);
  }

  function renderWarnings(warnings) {
    const box = el('aside', 'mrw-warning');
    box.setAttribute('role', 'status');
    const icon = el('div', 'mrw-warning-icon');
    icon.append(I.alert());
    const body = el('div', 'mrw-warning-body');
    body.append(el('div', 'mrw-warning-title',
      warnings.length === 1 ? 'Completed with a warning' : 'Completed with warnings'));
    const list = el('ul', 'mrw-warning-list');
    for (const warning of warnings) list.append(el('li', null, warning));
    body.append(list);
    box.append(icon, body);
    return box;
  }

  /* ════════ TREE state ════════ */
  /* Unknown structured results keep useful scalar facts without exposing the
     wire encoding, nested implementation objects, or local paths. */
  function summarySections(value) {
    const sections = [];
    let lead = null;
    if (value === null) return { lead, sections };
    if (typeof value !== 'object') return { lead: safeScalar(value), sections };
    if (Array.isArray(value)) {
      const values = value.map(safeScalar).filter(Boolean).slice(0, 12);
      return { lead: values.join('\n') || null, sections };
    }

    function visit(object, title, depth) {
      if (!isObject(object) || depth > 2) return;
      const facts = [];
      const nested = [];
      for (const [key, raw] of Object.entries(object)) {
        const label = safeKeyLabel(key);
        if (!label) continue;
        const scalar = safeScalar(raw);
        if (scalar) {
          facts.push({ label, value: scalar });
        } else if (Array.isArray(raw)) {
          const safeValues = raw.map(safeScalar).filter(Boolean).slice(0, 8);
          if (safeValues.length) {
            facts.push({ label, value: safeValues.join(', ') });
          } else if (raw.length && raw.every(item => isObject(item))) {
            facts.push({
              label,
              value: raw.length + (raw.length === 1 ? ' item' : ' items')
            });
          }
        } else if (isObject(raw)) {
          nested.push([label, raw]);
        }
      }
      if (facts.length) sections.push({ title: title || 'Summary', facts: facts.slice(0, 16) });
      for (const [label, child] of nested.slice(0, 8)) visit(child, label, depth + 1);
    }

    visit(value, null, 0);
    return { lead, sections };
  }

  function renderSummary(p, value) {
    const wrap = el('div', 'mrw-scroll');
    const summary = el('div', 'mrw-summary');
    const data = summarySections(value);
    if (data.lead) summary.append(el('div', 'mrw-summary-lead', data.lead));
    for (const section of data.sections) {
      const node = el('section', 'mrw-summary-section');
      node.append(el('div', 'mrw-summary-title', section.title));
      const facts = el('div', 'mrw-facts');
      for (const fact of section.facts) {
        facts.append(el('div', 'mrw-fact',
          el('span', 'mrw-fact-label', fact.label),
          el('span', 'mrw-fact-value', fact.value)));
      }
      node.append(facts);
      summary.append(node);
    }
    if (!data.lead && !data.sections.length) {
      summary.append(
        el('div', 'mrw-empty-title', 'Completed'),
        el('div', 'mrw-empty-sub', 'MacRemote kept technical result details out of this view.')
      );
    }
    wrap.append(summary);
    return wrap;
  }

  /* The generic profile is deliberately fail-closed. It can acknowledge the
     outcome and show harmless aggregate facts, but it never projects arbitrary
     strings from stdout or assistant content into the person-facing view. */
  function semanticMetricsFrom(text) {
    const metrics = [];
    let value;
    try { value = JSON.parse(String(text || '').trim()); } catch (_) { return metrics; }
    if (Array.isArray(value)) {
      metrics.push({ label: 'Items', value: String(value.length) });
      return metrics;
    }
    if (!isObject(value)) return metrics;
    for (const [key, raw] of Object.entries(value)) {
      const label = safeKeyLabel(key);
      if (!label) continue;
      const normalized = normalizeKey(key);
      if (typeof raw === 'boolean') {
        metrics.push({ label, value: raw ? 'Yes' : 'No' });
      } else if (typeof raw === 'number' && Number.isFinite(raw) &&
                 /(?:count|total|quantity|number|size)$/.test(normalized)) {
        metrics.push({ label, value: String(raw) });
      } else if (Array.isArray(raw)) {
        metrics.push({ label, value: String(raw.length) });
      }
      if (metrics.length >= 8) break;
    }
    return metrics;
  }

  function renderSemanticResult(p) {
    const box = el('div', 'mrw-empty mrw-semantic');
    const icon = el('div', 'mrw-empty-icon'); icon.append(I.checkTint());
    box.append(
      icon,
      el('div', 'mrw-empty-title', 'Completed'),
      el('div', 'mrw-empty-sub', 'MacRemote kept technical result details out of this view.')
    );
    const metrics = semanticMetricsFrom(p.stdout);
    if (metrics.length) box.append(renderMetaChips(metrics));
    return box;
  }

  function renderText(p, text) {
    const safe = safeDisplayText(text, { maximum: 32_000 });
    return safe ? renderDocument(p, { title: null, body: safe }) : renderSummary(p, null);
  }

  function renderTask(p) {
    const box = el('div', 'mrw-empty mrw-task');
    const icon = el('div', 'mrw-empty-icon'); icon.append(I.checkTint());
    const status = safeDisplayText(p.task && p.task.status, { singleLine: true, maximum: 80 });
    box.append(icon,
      el('div', 'mrw-empty-title', 'Running in the background'),
      el('div', 'mrw-empty-sub', status && status !== 'working'
        ? 'Current status: ' + prettyKey(status) + '.'
        : 'You can keep working while MacRemote finishes this task.'));
    return box;
  }

  function renderContentOnly() {
    const box = el('div', 'mrw-empty');
    const icon = el('div', 'mrw-empty-icon'); icon.append(I.checkTint());
    box.append(icon, el('div', 'mrw-empty-title', 'Completed'));
    return box;
  }

  /* ════════ ERROR state ════════ */
  function renderError(p) {
    const box = el('div', 'mrw-error');
    const timedOut = p.status === 'timeout';
    const title = timedOut
      ? p.tool.name + ' ran out of time'
      : p.tool.name + ' couldn’t complete this request';
    const messages = {
      invalid_argument: 'Check the request and try again.',
      not_approved: 'The request was not approved on the Mac.',
      unavailable: 'This tool is not available on the Mac right now.',
      killed: 'The tool stopped before it finished.',
      timeout: 'The tool took too long and was stopped.',
      output_limit: 'The result was larger than this tool allows.',
      internal_error: 'MacRemote hit an internal problem while handling the result.',
      nonzero_exit: 'The tool reported that it could not finish.'
    };
    const sub = messages[p.reason] || (timedOut
      ? messages.timeout
      : 'The tool reported that it could not finish.');

    const icon = el('div', 'mrw-error-icon'); icon.append(I.alert());
    box.append(el('div', 'mrw-error-head', icon,
      el('div', null, el('div', 'mrw-error-title', title), el('div', 'mrw-error-sub', sub))));

    return box;
  }

  /* ════════ EMPTY state ════════ */
  // Two ways to arrive here: no output at all, or a result that parsed to an
  // empty collection. The second is the ordinary answer to "what's due today?"
  // on a clear day, so it says nothing came back — not that nothing ran.
  function renderEmpty(p) {
    const box = el('div', 'mrw-empty');
    const icon = el('div', 'mrw-empty-icon'); icon.append(I.emptyCheck());
    const emptyResult = !!(p.stdout || '').trim();
    box.append(icon,
      el('div', 'mrw-empty-title', 'Completed — nothing to report'),
      el('div', 'mrw-empty-sub', p.tool.name + ' finished cleanly' +
        (emptyResult ? ', with nothing to show.' : ', with no output.')));
    return box;
  }

  /* ════════ OVERSIZED state ════════ */
  // stdout came back clipped and what survived doesn't parse — a JSON body cut
  // mid-object. Rendering the fragment shows a wall of half a record, so the
  // pretty UI explains the limit and leaves partial wire data hidden.
  function renderOversized(p, text) {
    const box = el('div', 'mrw-empty mrw-oversized');
    const icon = el('div', 'mrw-empty-icon'); icon.append(I.scissors());
    box.append(icon,
      el('div', 'mrw-empty-title', 'Output too large to display inline'),
      el('div', 'mrw-empty-sub',
        p.tool.name + ' returned more than fits in one result, so it was cut short; ' +
        'the full output stayed on the Mac.'));
    const t = p.truncated || {};
    if (Number.isFinite(t.shown)) {
      box.append(renderMetaChips([{
        label: 'Received',
        value: t.shown.toLocaleString() + ' ' + (t.unit || 'characters')
      }]));
    }
    return box;
  }

  /* ════════ footer ════════ */
  function attachmentTypeLabel(mimeType, kind) {
    const mime = String(mimeType || '').toLowerCase();
    if (mime.startsWith('image/')) return 'Image';
    if (mime.startsWith('audio/')) return 'Audio';
    if (mime.startsWith('video/')) return 'Video';
    if (mime === 'application/pdf') return 'PDF';
    if (mime.includes('json')) return 'Data file';
    if (mime.startsWith('text/')) return 'Text file';
    return kind === 'resource' ? 'File' : 'Attachment';
  }

  function readableBytes(value) {
    if (!Number.isFinite(value) || value < 0) return null;
    if (value < 1024) return Math.round(value) + ' B';
    if (value < 1024 * 1024) return (value / 1024).toFixed(1).replace(/\.0$/, '') + ' KB';
    return (value / (1024 * 1024)).toFixed(1).replace(/\.0$/, '') + ' MB';
  }

  function renderRichContent(p) {
    const items = Array.isArray(p.richContent) ? p.richContent : [];
    if (!items.length) return null;
    const region = el('section', 'mrw-rich');
    region.setAttribute('aria-label', 'Related content');
    region.append(el('div', 'mrw-rich-title', 'Related content'));
    const list = el('div', 'mrw-rich-list');
    for (const item of items) {
      if (!item || typeof item !== 'object') continue;
      if (item.kind === 'text') {
        const text = safeDisplayText(item.text, { maximum: 12_000 });
        if (text) list.append(el('div', 'mrw-rich-text', text));
        continue;
      }
      const type = attachmentTypeLabel(item.mimeType, item.kind);
      const name = safeDisplayText(item.name, { singleLine: true, maximum: 180 }) || type;
      const meta = [type, readableBytes(item.size)].filter(Boolean).join(' · ');
      const hasWebURI = typeof item.uri === 'string' && /^https?:\/\//i.test(item.uri);
      const protectedURI = hasWebURI && isCredentialBearingURL(item.uri);
      let node;
      if (hasWebURI && !protectedURI) {
        if (p.onOpenLink) {
          node = el('button', 'mrw-attachment');
          node.type = 'button';
          node.addEventListener('click', () => {
            Promise.resolve(p.onOpenLink(item.uri)).catch(() => {

          node.href = item.uri;
          node.target = '_blank';

        el('span', 'mrw-attachment-icon', type.slice(0, 1)),
        el('span', 'mrw-attachment-main',

  function renderFooter(p, displayText) {
    const f = el('footer', 'mrw-footer');
    f.append(el('span', 'mrw-footer-spacer'));

    if (displayText) {
      const copyBtn = el('button', 'mrw-btn');
      copyBtn.type = 'button';
      const setCopyLabel = (done) => {
        copyBtn.textContent = '';
        copyBtn.append(done ? I.checkTint() : I.copy(), done ? 'Copied' : 'Copy result');

      copyBtn.addEventListener('click', () => {
        copyToClipboard(displayText).then(() => {
          copyBtn.dataset.state = 'done'; setCopyLabel(true);
          setTimeout(() => { delete copyBtn.dataset.state; setCopyLabel(false); }, 1400);
        });
      });

    }

        (p.status === 'failed' || p.status === 'timeout'))) {
      const runBtn = el('button', 'mrw-btn mrw-btn-primary');
      runBtn.type = 'button';
      runBtn.dataset.mrwRunAgain = 'true';
      const setRunLabel = (state) => {
        runBtn.textContent = '';
        if (state === 'pending') runBtn.append(I.spinner(), 'Running…');
        else runBtn.append(I.rerun(), 'Run again');
      };
      setRunLabel('');
      runBtn.addEventListener('click', () => {
        if (runBtn.dataset.state === 'pending') return;
        runBtn.dataset.state = 'pending'; setRunLabel('pending');
        Promise.resolve(p.onRunAgain())
          .catch((error) => {

          .finally(() => { delete runBtn.dataset.state; setRunLabel(''); });

    p.tool = Object.assign({}, p.tool, {
      name: safeDisplayText(p.tool && p.tool.name, { singleLine: true, maximum: 160 }) || 'Tool'
    });
    p.warnings = warningMessagesFromPayload(p);
    if (p.status === 'success' && p.warnings.length) p.status = 'warning';
    const state = detectState(p);
    if (state === 'change' && p.status === 'failed') p.status = 'warning';
    if (state === 'batch') {
      const batch = batchPayloadFrom(presentationValueFrom(JSON.parse(p.stdout), p), p);
      if (batch.rows.every(row => row.state === 'unchanged')) p.status = 'failed';
      else if (batch.rows.some(row => row.state !== 'done')) p.status = 'warning';
    }
    const root = el('div', 'mrw');
    // Per-tool accent (e.g. RemCTL purple): recolor the accent AND the success
    // status line/chip so the whole card reads in the tool's color.
    if (p.accent) {
      root.style.setProperty('--accent', p.accent);
      root.style.setProperty('--accent-tint', 'color-mix(in srgb, ' + p.accent + ' 14%, transparent)');
      root.style.setProperty('--ok', p.accent);
      root.style.setProperty('--ok-line', p.accent);
      root.style.setProperty('--ok-tint', 'color-mix(in srgb, ' + p.accent + ' 16%, transparent)');
    }
    const card = el('article', 'mrw-card');
    card.dataset.status = p.status;
    card.setAttribute('aria-label', p.tool.name + ' — ' + (STATUS[p.status] || STATUS.success).label);

    card.append(el('div', 'mrw-accent'), renderHeader(p));
    // The oversized state states the truncation itself — the banner would say
    // the same thing twice.
    if (p.truncated && state !== 'oversized') card.append(renderTruncated(p.truncated));

    let completeJSON = null;
    let presentedJSON = null;
    try {
      completeJSON = JSON.parse(p.stdout.trim());
      presentedJSON = presentationValueFrom(completeJSON, p);
    } catch (_) {}
    let body;
    if (state === 'change')     body = renderChange(p, changePayloadFrom(presentedJSON, p));
    else if (state === 'batch') body = renderBatch(p, batchPayloadFrom(presentedJSON, p));
    else if (state === 'groups')body = renderSections(p, groupSectionsFrom(presentedJSON, p));
    else if (state === 'document') body = renderDocument(p, documentPayloadFrom(presentedJSON, p));
    else if (state === 'table') body = renderTable(p, tableRowsFrom(presentedJSON));
    else if (state === 'card')  body = renderCard(p, cardRowFrom(presentedJSON, p));
    else if (state === 'summary') body = renderSummary(p, presentedJSON);
    else if (state === 'semantic') body = renderSemanticResult(p);
    else if (state === 'task') body = renderTask(p);
    else if (state === 'content') body = renderContentOnly();
    else if (state === 'error') body = renderError(p);
    else if (state === 'empty') body = renderEmpty(p);
    else if (state === 'oversized') body = renderOversized(p, p.stdout);
    else                        body = renderText(p, p.stdout);
    const context = contextChipsFrom(completeJSON, p);
    if (context.length) body.append(renderMetaChips(context));
    card.append(body);
    if (p.warnings.length && p.status === 'warning' && state !== 'change') card.append(renderWarnings(p.warnings));
    const rich = renderRichContent(p);
    if (rich) card.append(rich);

    // Copy exactly what the person can see. The raw envelope, stderr, and
    // hidden content never enter the clipboard through this pretty UI.
    const visibleResult = safeDisplayText(card.innerText, { maximum: 32_000 });
    card.append(renderFooter(p, visibleResult || null));

    root.append(card);
    container.textContent = '';
    container.append(root);
    return { state };
  }

  return { mount, detectState };
})();

function reportSize() {
  if (!state.initialized || state.tornDown) return;
  const rect = documentRoot.getBoundingClientRect();
  const width = Math.ceil(rect.width);
  const height = Math.ceil(rect.height);
  if (!Number.isFinite(width) || width <= 0 ||
      !Number.isFinite(height) || height <= 0) return;
  const size = width + "x" + height;
  if (size === lastReportedSize) return;
  lastReportedSize = size;
  notify("ui/notifications/size-changed", { width, height });
}

resizeObserver = new ResizeObserver(reportSize);
resizeObserver.observe(document.body);

/* Resolve {input.name} (collected inputs) then {field} (row) placeholders. */
function substitute(value, row, inputs, typed) {
  // Only substitute primitives; an array/object field would String()-coerce
  // to "a,b" / "[object Object]" and silently corrupt the argv. Leave the
  // placeholder untouched instead so a misconfigured action fails loudly.
  const primitive = (v) => v !== undefined && v !== null && typeof v !== "object";
  if (typeof value === "string") {
    // An object property that is exactly one row placeholder keeps the row
    // value's type, so a numeric id reaches a typed tool schema as a number.
    // Array items are argv-style and always stay strings.
    const whole = typed ? /^\{([A-Za-z0-9_]+)\}$/.exec(value) : null;
    if (whole && primitive(row[whole[1]])) { return row[whole[1]]; }
    return value.replace(/\{([A-Za-z0-9_.]+)\}/g, (m, field) => {
      if (field.startsWith("input.")) {
        const v = (inputs || {})[field.slice(6)];
        return primitive(v) ? String(v) : m;
      }
      return primitive(row[field]) ? String(row[field]) : m;
    });
  }
  if (Array.isArray(value)) { return value.map(v => substitute(v, row, inputs, false)); }
  if (value && typeof value === "object") {
    const out = {};
    for (const k of Object.keys(value)) { out[k] = substitute(value[k], row, inputs, true); }
    return out;
  }
  return value;
}

function isExecutionEnvelope(value) {
  return isPlainObject(value) &&
    typeof value.succeeded === "boolean" &&
    typeof value.stdout === "string" &&
    typeof value.stderr === "string" &&
    typeof value.timedOut === "boolean";
}

function firstTextContent(result) {
  if (!Array.isArray(result.content)) return "";
  const block = result.content.find(item =>
    isPlainObject(item) &&
    item.type === "text" &&
    typeof item.text === "string" &&
    isAssistantVisible(item)
  );
  return block ? block.text : "";
}

function isAssistantVisible(block) {
  const annotations = isPlainObject(block && block.annotations) ? block.annotations : {};
  if (!Array.isArray(annotations.audience)) return true;
  return annotations.audience.includes("assistant");
}

function isExplicitAssistantContent(block) {
  const annotations = isPlainObject(block && block.annotations) ? block.annotations : {};
  return Array.isArray(annotations.audience) && annotations.audience.includes("assistant");
}

function structuredTextMatches(text, structuredContent) {
  if (typeof text !== "string" || structuredContent === undefined) return false;
  try {
    return JSON.stringify(JSON.parse(text)) === JSON.stringify(structuredContent);
  } catch (_) {
    return typeof structuredContent === "string" && text.trim() === structuredContent.trim();
  }
}

function richContentFrom(result, structuredContent, env, includeText) {
  if (!Array.isArray(result.content)) return [];
  const rich = [];
  const primaryFallback = firstTextContent(result).trim();
  for (const block of result.content) {
    if (!isPlainObject(block) || !isAssistantVisible(block)) continue;
    if (block.type === "text" && typeof block.text === "string") {
      if (!includeText) continue;
      const text = block.text.trim();
      // An unannotated text block next to structured content is normally the
      // model fallback serialization. Only an explicit assistant-audience
      // block is additional prose that belongs in this visual result.
      if (!text || (structuredContent !== undefined && !isExplicitAssistantContent(block)) ||
          (structuredContent === undefined && text === primaryFallback) ||
          structuredTextMatches(text, structuredContent) ||
          (env && text === env.stdout.trim())) continue;
      rich.push({ kind: "text", text });
      continue;
    }
    if (block.type === "resource_link" && typeof block.uri === "string") {
      rich.push({
        kind: "resource", uri: block.uri,
        name: typeof block.title === "string" ? block.title : block.name,
        mimeType: typeof block.mimeType === "string" ? block.mimeType : null,
        size: Number.isFinite(block.size) ? block.size : null
      });
      continue;
    }
    if (block.type === "image" || block.type === "audio") {
      rich.push({
        kind: block.type,
        name: block.type === "image" ? "Image result" : "Audio result",
        mimeType: typeof block.mimeType === "string" ? block.mimeType : null
      });
      continue;
    }
    if (block.type === "resource" && isPlainObject(block.resource)) {
      const resource = block.resource;
      if (typeof resource.text === "string" && includeText) {
        rich.push({ kind: "text", text: resource.text });
      } else if (typeof resource.text !== "string") {
        rich.push({
          kind: "resource",
          name: typeof resource.title === "string" ? resource.title : resource.name,
          mimeType: typeof resource.mimeType === "string" ? resource.mimeType : null
        });
      }
    }
  }
  return rich;
}

function structuredContentText(value) {
  if (typeof value === "string") return value;
  try {
    const serialized = JSON.stringify(value);
    return typeof serialized === "string" ? serialized : "";
  } catch (_) {
    return "";
  }
}

function renderResult() {
  const result = state.result || {};
  const hasStructuredContent = Object.prototype.hasOwnProperty.call(result, "structuredContent");
  const structuredContent = hasStructuredContent ? result.structuredContent : undefined;
  let env = isExecutionEnvelope(structuredContent) ? structuredContent : null;
  if (!hasStructuredContent) {
    try {
      const fallback = JSON.parse(firstTextContent(result));
      if (isExecutionEnvelope(fallback)) env = fallback;
    } catch (_) {}
  }
  const task = result.resultType === "task" ? result : null;
  const resultMeta = isPlainObject(result._meta) ? result._meta : {};
  // Some hosts deliver the widget-only metadata through their compatibility
  // bridge. Standard result metadata always wins when both are present.
  const compatMeta = isPlainObject(window.openai && window.openai.toolResponseMetadata)
    ? window.openai.toolResponseMetadata : {};
  const candidateMeta = resultMeta[UI_META_KEY] || compatMeta[UI_META_KEY];
  const meta = isPlainObject(candidateMeta) ? candidateMeta : {};
  const profile = ["reminderRows", "episodeRows", "habitRows", "noteRows"].includes(meta.profile)
    ? meta.profile : "semanticResult";
  const actions = canCallServerTools() && Array.isArray(meta.actions)
    ? meta.actions.filter(isPlainObject) : [];
  const byId = {};
  for (const a of actions) { byId[a.id] = a; }
  const check = actions.find(a => a.kind === "checkOff") || null;

  const table = isPlainObject(meta.table) ? meta.table : {};
  const stdout = env
    ? env.stdout
    : (task ? "" : (hasStructuredContent ? structuredContentText(structuredContent) : firstTextContent(result)));
  MacRemoteWidget.mount(rootEl, {
    tool: { name: typeof meta.toolTitle === "string"
      ? meta.toolTitle
      : (env && typeof env.toolName === "string" ? env.toolName : "Tool") },
    status: env
      ? (env.timedOut ? "timeout" : (env.succeeded ? "success" : "failed"))
      : (result.isError === true ? "failed" : "success"),
    profile,
    accent: typeof meta.accent === "string" ? meta.accent : null,
    columns: Array.isArray(table.columns) ? table.columns : null,
    hiddenColumns: Array.isArray(table.hiddenColumns) ? table.hiddenColumns : null,
    rootPath: typeof table.rootPath === "string" ? table.rootPath : null,
    document: isPlainObject(table.document) ? table.document : null,
    context: Array.isArray(table.context) ? table.context.filter(isPlainObject) : null,
    retryOnError: table.retryOnError !== false,
    // Curated multi-value presentation: ordered sections for a payload with
    // several row arrays, and the confirmation shape for a change command.
    groups: Array.isArray(table.groups) ? table.groups.filter(isPlainObject) : null,
    change: isPlainObject(table.change) ? table.change : null,
    stdout,
    reason: env && typeof env.reason === "string" ? env.reason : null,
    task,
    richContent: richContentFrom(result, structuredContent, env, profile !== "semanticResult"),
    truncated: env && env.truncatedStdout
      ? { shown: env.stdout.length, total: null, unit: "characters" }
      : null,
    rowActions: actions.map(a => ({
      id: a.id,
      kind: a.kind === "checkOff" ? "check" : "button",
      label: a.title,
      doneLabel: "Done",
      title: a.title,
      style: a.style || "normal",
      inputs: a.inputs || null
    })),
    isRowCompleted: check ? (row) => {
      const v = row[check.completedWhenField];
      return check.completedWhenEquals != null ? String(v) === check.completedWhenEquals : !!v;
    } : null,
    actionApplies: (act, row) => {
      const raw = byId[act.id];
      const requiredFields = raw && Array.isArray(raw.requiredRowFields)
        ? raw.requiredRowFields.filter(field => typeof field === "string")
        : [];
      if (row.deleted === true || row.isDeleted === true) return false;
      return !raw || requiredFields.every(f => row[f] !== undefined && row[f] !== null);
    },
    onAction: canCallServerTools() ? (actionId, row, inputValues) => {
      const raw = byId[actionId];
      if (!raw) { return Promise.reject(new Error("unknown action")); }
      return request("tools/call", {
        name: raw.toolName,
        arguments: substitute(raw.arguments, row, inputValues)
      }).then(r => {
        if (r && r.isError === true) {
          // Do not copy subprocess output into a tooltip. The action remains
          // visibly failed while implementation details stay on the Mac.
          throw new Error("The action could not be completed.");
        }
      });
    } : null,
    onRunAgain: canCallServerTools() && meta.toolName && meta.capability === "readOnly"
      ? () => request("tools/call", { name: meta.toolName, arguments: state.toolInput || {} })
          .then(r => { state.result = r; renderResult(); })
      : null,
    onOpenLink: canOpenLinks()
      ? (url) => request("ui/open-link", { url })
      : null
  });
  // ResizeObserver is the steady-state path. Report synchronously after the
  // initial render too; otherwise a compact result can fit inside the host's
  // placeholder frame without producing an observer transition.
  reportSize();
}
})();
</script>
</body>
</html>
